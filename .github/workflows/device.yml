name: 아이폰 설치용 빌드

# 실기기용 빌드. 수동 실행 전용 (macOS 러너 분을 아끼기 위해 push 로는 돌지 않는다).
#
#   unsigned-ipa : 서명 없는 .ipa 를 만든다. Apple 개발자 계정 불필요.
#                  Windows 에서 Sideloadly + 무료 Apple ID 로 아이폰에 설치한다.
#   testflight   : 서명해서 App Store Connect 에 올린다. Apple Developer Program($99/년) 필요.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "배포 방식"
        type: choice
        options:
          - unsigned-ipa
          - testflight
        default: unsigned-ipa
      notes:
        description: "TestFlight 테스터에게 보여줄 메모 (testflight 모드에서만)"
        type: string
        required: false

jobs:
  build:
    name: ${{ inputs.mode }}
    runs-on: macos-15
    timeout-minutes: 45

    env:
      BUNDLE_ID: com.zipshowkorea.weddingplant
      SCHEME: WeddingPlant
      # TestFlight 는 같은 빌드 번호를 두 번 받지 않는다. 실행 번호를 그대로 쓴다.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: XcodeGen 설치
        run: brew install xcodegen

      - name: Xcode 프로젝트 생성
        run: xcodegen generate

      # ── 서명 없는 .ipa (계정 불필요) ─────────────────────────────────────────
      - name: 디바이스용 빌드 (서명 없음)
        if: inputs.mode == 'unsigned-ipa'
        env:
          # 백엔드 주소는 저장소가 공개라 커밋하지 않는다. 시크릿으로 주입한다.
          # 비어 있으면 앱이 Config/Base.xcconfig 의 기본값(localhost)으로 떨어진다.
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          xcodebuild build \
            -project WeddingPlant.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            API_BASE_URL="${API_BASE_URL:-}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS=""

      - name: .ipa 로 포장
        if: inputs.mode == 'unsigned-ipa'
        run: |
          set -euo pipefail
          APP="build/DerivedData/Build/Products/Release-iphoneos/${SCHEME}.app"
          test -d "$APP" || { echo "빌드 산출물을 찾을 수 없습니다: $APP"; ls -R build/DerivedData/Build/Products || true; exit 1; }

          mkdir -p out/Payload
          cp -R "$APP" out/Payload/
          (cd out && zip -qry "${SCHEME}-unsigned.ipa" Payload)
          rm -rf out/Payload
          ls -lh out/

      - name: 업로드 (서명 없는 .ipa)
        if: inputs.mode == 'unsigned-ipa'
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-ipa
          path: out/*.ipa
          retention-days: 14

      # ── TestFlight (Apple Developer Program 필요) ────────────────────────────
      - name: 서명 자산 설치
        if: inputs.mode == 'testflight'
        env:
          P12_BASE64: ${{ secrets.IOS_DIST_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_DIST_P12_PASSWORD }}
          PROFILE_BASE64: ${{ secrets.IOS_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${P12_BASE64:-}" ]; then
            echo "::error::IOS_DIST_P12_BASE64 시크릿이 없습니다. docs/INSTALL_ON_IPHONE.md 의 1회 설정을 먼저 끝내세요."
            exit 1
          fi

          echo "$P12_BASE64" | base64 --decode > /tmp/dist.p12
          echo "$PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision

          KEYCHAIN=build.keychain
          security create-keychain -p "" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security import /tmp/dist.p12 -k "$KEYCHAIN" -P "$P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/"

          # 프로파일에서 이름과 팀 ID 를 읽어 이후 단계에 넘긴다 (직접 입력할 필요 없게).
          PLIST=$(security cms -D -i /tmp/profile.mobileprovision)
          PROFILE_NAME=$(echo "$PLIST" | plutil -extract Name raw -)
          TEAM_ID=$(echo "$PLIST" | plutil -extract TeamIdentifier.0 raw -)
          echo "PROFILE_NAME=$PROFILE_NAME" >> "$GITHUB_ENV"
          echo "TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "프로파일: $PROFILE_NAME / 팀: $TEAM_ID"

      - name: 아카이브
        if: inputs.mode == 'testflight'
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL }}
        run: |
          set -euo pipefail
          if [ -z "${API_BASE_URL:-}" ]; then
            echo "::warning::API_BASE_URL 시크릿이 없습니다. 앱이 localhost 를 보게 되어 실기기에서 동작하지 않습니다."
          fi
          xcodebuild archive \
            -project WeddingPlant.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/WeddingPlant.xcarchive \
            API_BASE_URL="${API_BASE_URL:-}" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            CODE_SIGNING_ALLOWED=YES \
            CODE_SIGNING_REQUIRED=YES \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            CODE_SIGN_IDENTITY="Apple Distribution"

      - name: .ipa 내보내기
        if: inputs.mode == 'testflight'
        run: |
          set -euo pipefail
          cat > /tmp/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>manual</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key><dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict></plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath build/WeddingPlant.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ipa
          ls -lh build/ipa

      - name: TestFlight 업로드
        if: inputs.mode == 'testflight'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/private_keys"
          echo "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          IPA=$(ls build/ipa/*.ipa | head -1)
          echo "업로드: $IPA (빌드 번호 $BUILD_NUMBER)"

          xcrun altool --upload-app -f "$IPA" -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

          echo "업로드 완료. App Store Connect 처리에 10~30분 걸린 뒤 TestFlight 에 나타납니다."

      - name: 업로드 (.ipa 백업본)
        if: inputs.mode == 'testflight' && always()
        uses: actions/upload-artifact@v4
        with:
          name: testflight-ipa
          path: build/ipa/*.ipa
          if-no-files-found: warn
          retention-days: 7
