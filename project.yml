# XcodeGen 설정.
#
# .xcodeproj 는 Windows 에서 만들 수 없으므로 커밋하지 않고, 이 YAML 로부터 CI(macOS)에서
# `xcodegen generate` 로 매번 생성한다. 프로젝트 구조 변경은 전부 이 파일에서 한다.

name: WeddingPlant

options:
  bundleIdPrefix: com.zipshowkorea
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  WeddingPlantCore:
    path: Core

settings:
  base:
    # App 타깃은 Windows 에서 컴파일 검증이 불가능하므로, 블라인드 작성 코드가
    # strict concurrency 로 무더기 에러를 내지 않도록 Swift 5 언어 모드를 쓴다.
    # (Core 는 SwiftPM 쪽에서 Swift 6 모드로 빌드된다 — 상호 운용 문제 없음)
    SWIFT_VERSION: "5.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

    # 서명은 자동으로 둔다. Xcode 에서 실기기로 돌릴 때 무료 Apple ID 로 바로 된다.
    # CI 는 명령줄에서 덮어쓴다:
    #   시뮬레이터/무서명 ipa → CODE_SIGNING_ALLOWED=NO
    #   TestFlight          → CODE_SIGN_STYLE=Manual + 프로파일 지정
    # 명령줄 설정이 항상 우선하므로 여기서 끌 필요가 없다.
    CODE_SIGN_STYLE: Automatic
    # 팀 ID 를 알면 여기에 박아두면 xcodegen 재생성 때마다 다시 고르지 않아도 된다.
    # (Xcode → Settings → Accounts 에서 확인. 무료 계정도 팀 ID 가 있다)
    DEVELOPMENT_TEAM: ""

targets:
  WeddingPlant:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
    # 환경 설정은 xcconfig 로 주입한다. Config/Base.xcconfig 가 Config/Local.xcconfig 를
    # 선택적으로 include 하므로, 각자 로컬 값은 커밋 없이 덮어쓸 수 있다.
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zipshowkorea.weddingplant
        PRODUCT_NAME: WeddingPlant
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_GENERATE_ASSET_SYMBOL_EXTENSIONS: NO
    dependencies:
      - package: WeddingPlantCore
        product: WPModels
      - package: WeddingPlantCore
        product: WPUtils
      - package: WeddingPlantCore
        product: WPNetworking
      - package: WeddingPlantCore
        product: WPDomain
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: 웨딩플랜
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 한국 사용자 전용 앱. 이걸 지정하지 않으면 DatePicker 등 시스템 컴포넌트가
        # 기기 언어(영어)를 따라가 "August 2026 / SUN MON TUE" 로 표시된다.
        CFBundleDevelopmentRegion: ko
        CFBundleLocalizations:
          - ko
        # xcconfig 에서 주입된다. AppEnvironment.baseURL() 이 이 키를 읽는다.
        API_BASE_URL: $(API_BASE_URL)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIUserInterfaceStyle: Light
        # TestFlight 첫 빌드마다 수출 규정 질문이 뜨는 것을 막는다.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true

  WeddingPlantUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: App/UITests
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zipshowkorea.weddingplant.uitests
    dependencies:
      - target: WeddingPlant

schemes:
  WeddingPlant:
    build:
      targets:
        WeddingPlant: all
        WeddingPlantUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - WeddingPlantUITests
